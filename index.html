<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Анализ возврата товара</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f2f2f2;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>AI-анализ возвратов</h1>
  <p>Загрузите фото товара для автоматического определения причины возврата:</p>
  
  <input type="file" id="imageInput" accept="image/*">
  <button onclick="classifyImage()">Анализировать</button>

  <div id="result"></div>

  <script>
    async function classifyImage() {
      const input = document.getElementById('imageInput');
      if (!input.files.length) {
        alert("Пожалуйста, выберите изображение.");
        return;
      }

      const file = input.files[0];
      const formData = new FormData();
      formData.append("file", file);

      const resultDiv = document.getElementById('result');
      resultDiv.textContent = "Загрузка и анализ...";

      try {
        const response = await fetch("https://spdvlg.pythonanywhere.com/analyze", {
          method: "POST",
          body: formData
        });

        const data = await response.json();
        resultDiv.textContent = "Классификация: " + data.classification;
      } catch (err) {
        console.error(err);
        resultDiv.textContent = "Произошла ошибка при анализе.";
      }
    }
  </script>
</body>
</html>
